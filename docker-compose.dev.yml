services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: altcast
      POSTGRES_PASSWORD: altcast_dev
      POSTGRES_DB: altcast
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U altcast"]
      interval: 5s
      retries: 10
    volumes: ["pgdata:/var/lib/postgresql/data"]

  api:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm --workspace api run dev"
    environment:
      DATABASE_URL: postgres://altcast:altcast_dev@postgres:5432/altcast
      NODE_ENV: development
      PORT: "3000"
      ALLOWED_ORIGINS: http://localhost:5173
      PUBLIC_URL: http://localhost:5173
      SESSION_COOKIE_NAME: altcast_session
      SESSION_TTL_DAYS: "30"
      LOG_LEVEL: debug
      # Casam com ops/livekit.dev.yaml. O navegador fala com o SFU direto em
      # localhost:7880 porque em desenvolvimento nao ha Caddy no caminho.
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret_altcast_desenvolvimento_local_32
      LIVEKIT_URL: ws://localhost:7880
      # Casam com o servico minio abaixo. Credenciais de brinquedo: este
      # arquivo nunca sobe em producao.
      STORAGE_ENDPOINT: minio
      STORAGE_PORT: "9000"
      STORAGE_ACCESS_KEY: altcast
      STORAGE_SECRET_KEY: altcast_dev_minio
      STORAGE_BUCKET: altcast
      STORAGE_USE_SSL: "false"
      # Sem chave de proposito: em desenvolvimento o correio escreve a mensagem
      # inteira no log do container, e o link de recuperacao pode ser copiado
      # de la. Percorre o fluxo todo sem credencial nenhuma. Para exercitar o
      # envio de verdade, passe RESEND_API_KEY pelo ambiente.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Altcast <nao-responda@altcast.local>}
    ports: ["3000:3000"]
    volumes:
      # O bind traz o codigo-fonte; os volumes anonimos impedem que o
      # node_modules Linux do container sobrescreva o do host (Windows).
      - ".:/app"
      - "/app/node_modules"
      - "/app/api/node_modules"
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }

  livekit:
    image: livekit/livekit-server:v1.13
    command: --config /etc/livekit.yaml
    volumes: ["./ops/livekit.dev.yaml:/etc/livekit.yaml:ro"]
    # `host` evita a traducao de portas do Docker: com bridge, os candidatos
    # ICE anunciariam o IP interno do container e a midia nunca chegaria. Em
    # Windows e macOS, onde host nao existe, as portas publicadas abaixo dao
    # conta porque o SFU cai para TCP em 7881.
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: altcast
      MINIO_ROOT_PASSWORD: altcast_dev_minio
    # Em desenvolvimento o console ajuda a ver o que subiu. Em producao nao ha
    # porta nenhuma publicada — ver docker-compose.yml.
    ports: ["9001:9001"]
    volumes: ["miniodata:/data"]

volumes:
  pgdata:
  miniodata:
